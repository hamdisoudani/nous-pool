[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nous-pool"
version = "0.1.0"
description = "OpenAI-compatible Nous Inference pool proxy with admin panel for managing multiple Hermes/Nous accounts (round-robin)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.19",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1.0",
  "PyJWT>=2.9.0",
  "python-multipart>=0.0.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
